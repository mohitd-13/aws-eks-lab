<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ED7100"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" rx="12" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#232F3E">aws-eks-lab — architecture</text>
  <text x="30" y="62" font-size="12" fill="#545B64">Terraform · Kubernetes 1.33 · ap-south-1</text>

  <!-- Internet -->
  <rect x="335" y="20" width="120" height="38" rx="19" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="395" y="44" font-size="13" text-anchor="middle" fill="#232F3E">Internet</text>
  <path d="M395,58 V132" stroke="#37474F" stroke-width="1.6" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- kubectl user -->
  <rect x="915" y="30" width="150" height="45" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="990" y="58" font-size="13" text-anchor="middle" fill="#232F3E">You (kubectl)</text>

  <!-- Region -->
  <rect x="20" y="100" width="1160" height="670" rx="14" fill="none" stroke="#545B64" stroke-width="1.6" stroke-dasharray="9 6"/>
  <text x="40" y="124" font-size="13" font-weight="bold" fill="#232F3E">Region: ap-south-1</text>

  <!-- VPC -->
  <rect x="40" y="150" width="750" height="595" rx="14" fill="#FBF8FF" stroke="#7D3FC8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="60" y="176" font-size="14" font-weight="bold" fill="#7D3FC8">VPC <tspan font-size="11" font-weight="normal">10.0.0.0/16</tspan></text>

  <!-- Internet Gateway (resource, straddles VPC edge) -->
  <rect x="335" y="132" width="120" height="36" rx="6" fill="#F3E9FB" stroke="#7D3FC8" stroke-width="1.8"/>
  <text x="395" y="155" font-size="12" text-anchor="middle" fill="#232F3E">Internet Gateway</text>

  <!-- AZ-1 -->
  <rect x="70" y="200" width="330" height="510" rx="10" fill="none" stroke="#545B64" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="85" y="219" font-size="12" font-weight="bold" fill="#545B64">AZ-1 · ap-south-1a</text>

  <!-- AZ-2 -->
  <rect x="430" y="200" width="330" height="510" rx="10" fill="none" stroke="#545B64" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="445" y="219" font-size="12" font-weight="bold" fill="#545B64">AZ-2 · ap-south-1b</text>

  <!-- Public subnets -->
  <rect x="90" y="235" width="290" height="120" rx="8" fill="#F2F8EE" stroke="#3F8624" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="105" y="256" font-size="13" font-weight="bold" fill="#3F8624">Public subnet <tspan font-size="11" font-weight="normal">10.0.101.0/24</tspan></text>
  <rect x="450" y="235" width="290" height="120" rx="8" fill="#F2F8EE" stroke="#3F8624" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="465" y="256" font-size="13" font-weight="bold" fill="#3F8624">Public subnet <tspan font-size="11" font-weight="normal">10.0.102.0/24</tspan></text>

  <!-- NAT Gateway (single, AZ-1 public subnet) -->
  <rect x="180" y="285" width="110" height="55" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.8"/>
  <text x="235" y="309" font-size="12" font-weight="bold" text-anchor="middle" fill="#232F3E">NAT Gateway</text>
  <text x="235" y="326" font-size="10.5" text-anchor="middle" fill="#545B64">single, shared</text>

  <!-- Private subnets -->
  <rect x="90" y="420" width="290" height="265" rx="8" fill="#EEF6FB" stroke="#147EBA" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="105" y="441" font-size="13" font-weight="bold" fill="#147EBA">Private subnet <tspan font-size="11" font-weight="normal">10.0.1.0/24</tspan></text>
  <rect x="450" y="420" width="290" height="265" rx="8" fill="#EEF6FB" stroke="#147EBA" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="465" y="441" font-size="13" font-weight="bold" fill="#147EBA">Private subnet <tspan font-size="11" font-weight="normal">10.0.2.0/24</tspan></text>

  <!-- Managed node group (AZ-1 private) -->
  <rect x="110" y="460" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#147EBA" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="125" y="478" font-size="12" font-weight="bold" fill="#232F3E">Managed node group "default"</text>
  <rect x="130" y="488" width="210" height="52" rx="6" fill="#E3F2FD" stroke="#147EBA" stroke-width="1.6"/>
  <text x="235" y="510" font-size="12" font-weight="bold" text-anchor="middle" fill="#232F3E">Worker node</text>
  <text x="235" y="527" font-size="11" text-anchor="middle" fill="#545B64">t3.medium · min/max/desired = 1</text>
  <rect x="130" y="550" width="210" height="60" rx="6" fill="#FAFAFA" stroke="#90A4AE" stroke-width="1.2"/>
  <text x="140" y="566" font-size="11" font-weight="bold" fill="#232F3E">EKS addons</text>
  <text x="140" y="582" font-size="11" fill="#37474F">vpc-cni · kube-proxy · coredns</text>
  <text x="140" y="597" font-size="11" fill="#37474F">eks-pod-identity-agent</text>

  <!-- AZ-2 private: no nodes -->
  <text x="595" y="535" font-size="12" text-anchor="middle" fill="#78909C">No nodes</text>
  <text x="595" y="552" font-size="11" text-anchor="middle" fill="#78909C">(single node runs in AZ-1)</text>

  <!-- EKS-managed ENIs (inside private subnets) -->
  <rect x="280" y="635" width="90" height="30" rx="6" fill="#FFF3E0" stroke="#ED7100" stroke-width="1.6"/>
  <text x="325" y="654" font-size="11" text-anchor="middle" fill="#232F3E">EKS ENI</text>
  <rect x="640" y="635" width="90" height="30" rx="6" fill="#FFF3E0" stroke="#ED7100" stroke-width="1.6"/>
  <text x="685" y="654" font-size="11" text-anchor="middle" fill="#232F3E">EKS ENI</text>

  <!-- Routes: NAT -> IGW (starts at the NAT box) -->
  <path d="M235,285 V190 H395 V170" stroke="#37474F" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="250" y="183" font-size="11" fill="#37474F">NAT egress</text>

  <!-- Routes: AZ-2 public subnet <-> IGW -->
  <path d="M395,190 H595 V233" stroke="#37474F" stroke-width="1.6" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="410" y="183" font-size="11" fill="#37474F">public route 0.0.0.0/0 → IGW</text>

  <!-- Routes: AZ-1 private -> NAT -->
  <path d="M235,460 V342" stroke="#37474F" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="228" y="392" font-size="11" text-anchor="end" fill="#37474F">0.0.0.0/0 → NAT</text>

  <!-- Routes: AZ-2 private -> NAT (cross-AZ) -->
  <path d="M500,420 V375 H275 V342" stroke="#37474F" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="368" font-size="11" fill="#37474F">cross-AZ via NAT</text>

  <!-- AWS-managed VPC with EKS control plane -->
  <rect x="820" y="330" width="340" height="280" rx="12" fill="none" stroke="#ED7100" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="835" y="352" font-size="12" font-weight="bold" fill="#B45F06">AWS-managed VPC</text>
  <rect x="845" y="372" width="290" height="218" rx="10" fill="#FFF6EC" stroke="#ED7100" stroke-width="1.8"/>
  <text x="990" y="396" font-size="13" font-weight="bold" text-anchor="middle" fill="#232F3E">EKS Control Plane</text>
  <rect x="865" y="415" width="250" height="40" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.4"/>
  <text x="990" y="440" font-size="12" text-anchor="middle" fill="#232F3E">API server endpoint</text>
  <text x="990" y="482" font-size="11" text-anchor="middle" fill="#545B64">etcd · scheduler · controller manager</text>
  <text x="990" y="500" font-size="11" text-anchor="middle" fill="#545B64">(managed by AWS)</text>
  <text x="990" y="530" font-size="11" text-anchor="middle" fill="#545B64">Kubernetes 1.33</text>

  <!-- kubectl -> API server -->
  <path d="M990,75 V413" stroke="#37474F" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="1002" y="250" font-size="11" fill="#37474F">kubectl → API server</text>

  <!-- Control plane <-> nodes via ENIs -->
  <path d="M325,665 V724 H1000 V592" stroke="#ED7100" stroke-width="1.8" fill="none" marker-start="url(#arrow-o)" marker-end="url(#arrow-o)"/>
  <path d="M685,665 V724" stroke="#ED7100" stroke-width="1.8" fill="none"/>
  <text x="345" y="740" font-size="11" fill="#B45F06">EKS-managed ENIs: control plane to nodes (kubelet to API server)</text>

  <!-- Legend -->
  <line x1="30" y1="797" x2="70" y2="797" stroke="#37474F" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="78" y="801" font-size="11" fill="#545B64">network route</text>
  <line x1="185" y1="797" x2="225" y2="797" stroke="#ED7100" stroke-width="1.8" marker-end="url(#arrow-o)"/>
  <text x="233" y="801" font-size="11" fill="#545B64">control plane traffic</text>
  <rect x="380" y="790" width="22" height="14" rx="3" fill="#F2F8EE" stroke="#3F8624" stroke-dasharray="3 2"/>
  <text x="408" y="801" font-size="11" fill="#545B64">public</text>
  <rect x="470" y="790" width="22" height="14" rx="3" fill="#EEF6FB" stroke="#147EBA" stroke-dasharray="3 2"/>
  <text x="498" y="801" font-size="11" fill="#545B64">private</text>
  <text x="580" y="801" font-size="11" fill="#545B64">dashed = boundary · solid = resource</text>
</svg>
