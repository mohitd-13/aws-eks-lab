name: Apply Plan

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - '**.tf'

permissions:
  id-token: write
  contents: read

jobs:
  re-plan:
    name: Re-initialize backend & plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Initialize Terraform
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Post plan to job summary
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: re-plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Infra Code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Initialize Terraform
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v5
        with:
          name: tfplan

      - name: Terraform Apply
        run: |
            terraform apply tfplan -var="eks_permissions_boundary_arn=${{ vars.CI_PERMISSIONS_BOUNDARY_ARN }}"

      - name: Verify node readiness
        run: |
          aws eks update-kubeconfig --name $(terraform output --raw cluster_name) --region ${{ vars.AWS_REGION }}
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
